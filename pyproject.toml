[tool.poetry]
name = "qwsmoothq"
version = "0.1.0"
description = "面向企微等限流不明外部 API 的自适应均速队列中间件（Redis 队列 + 双层控速 + 退避重试 + 按秒统计）"
authors = ["orangeMoon <orangemoon@example.com>"]
readme = "README.md"
packages = [{ include = "qwsmoothq" }, { include = "mock_wecom" }]

[tool.poetry.dependencies]
python = ">=3.14,<4.0"
fastapi = ">=0.115,<1.0"
uvicorn = { version = ">=0.32,<1.0", extras = ["standard"] }
httpx = ">=0.28,<1.0"
redis = ">=6.0,<7.0"
asyncpg = ">=0.30,<1.0"
pydantic = ">=2.9,<3.0"
pydantic-settings = ">=2.6,<3.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3,<9.0"
pytest-asyncio = ">=0.24,<1.0"
fakeredis = { version = ">=2.26,<3.0", extras = ["lua"] }

[tool.poetry.scripts]
qwsmoothq = "qwsmoothq.cli:main"
mock-wecom = "mock_wecom.cli:mock_main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q"
